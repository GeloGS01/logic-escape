<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT 7 Top Scores</title>
<style>
  :root {
    --navy: #0B1D2E; --ink: #0F172A; --card: #EEF2F7; --line: #CBD5E1; --muted: #64748B;
    --amber: #F59E0B; --amber-soft: #FEF3C7; --green: #22C55E; --green-dark: #15803D; --green-soft: #DCFCE7;
    --red: #DC2626; --red-soft: #FEE2E2; --white: #FFFFFF; --violet: #7C3AED;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--white); color: var(--ink); font: 18px/1.4 -apple-system, "Segoe UI", Calibri, Arial, sans-serif; }
  .school { background: var(--white); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .school img { height: 64px; width: auto; display: block; }
  .school .acs { max-width: 70%; object-fit: contain; }
  header { background: var(--navy); color: var(--white); padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 28px; }
  header .kicker { color: var(--amber); font-weight: 700; font-size: 15px; }
  header .credit { color: #94A3B8; font-size: 14px; margin-top: 2px; }
  header .credit b { color: #CBD5E1; font-weight: 600; }
  header .score { margin-left: auto; text-align: right; }
  header .score b { font: 800 30px "Courier New", monospace; color: var(--amber); display: block; }
  header .score span { color: #94A3B8; font-size: 14px; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 32px; }
  .dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .dots span { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 17px; border: 2px solid var(--line); background: var(--card); color: #94A3B8; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .dots span.done { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); }
  .dots span.here { background: var(--ink); border-color: var(--ink); color: var(--white); }
  .panel { background: var(--amber-soft); border-radius: 14px; padding: 14px 20px; }
  .panel h2 { margin: 0 0 4px; font-size: 25px; }
  .panel .how { color: #92400E; font-weight: 600; }
  .lab { display: grid; grid-template-columns: 1fr 260px; gap: 18px; margin-top: 14px; align-items: start; }
  .bench { background: var(--card); border-radius: 14px; padding: 12px; text-align: center; }
  .bench svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
  .switches { display: flex; gap: 14px; justify-content: center; margin-top: 8px; }
  .sw { font: inherit; font-size: 22px; font-weight: 800; padding: 10px 22px; border-radius: 14px; border: 3px solid var(--line); background: var(--white); cursor: pointer; min-width: 140px; }
  .sw.on { background: var(--green); border-color: var(--green-dark); color: var(--white); }
  .side h3 { margin: 0 0 6px; font-size: 17px; text-align: center; }
  table.tt { border-collapse: collapse; margin: 0 auto; font: 700 22px "Courier New", monospace; }
  table.tt th, table.tt td { border: 2px solid var(--line); padding: 5px 18px; text-align: center; }
  table.tt th { background: var(--ink); color: var(--white); }
  table.tt th.out { background: var(--amber); color: var(--ink); }
  table.tt td.out { background: var(--amber-soft); min-width: 70px; }
  table.tt tr.now td { outline: 3px solid var(--amber); outline-offset: -3px; }
  .tested { text-align: center; color: var(--muted); font-weight: 700; margin-top: 8px; }
  .choices { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .choices button { min-width: 120px; font: inherit; font-size: 23px; font-weight: 800; padding: 12px 20px; border-radius: 14px; border: 3px solid var(--line); background: var(--white); color: var(--ink); cursor: pointer; }
  .choices button:hover:not([disabled]) { border-color: var(--amber); background: var(--amber-soft); }
  .choices button.right { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); }
  .choices button.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .choices button[disabled] { cursor: default; opacity: .9; }
  .q { text-align: center; font-size: 22px; font-weight: 800; margin-top: 14px; }
  .feedback { min-height: 56px; margin-top: 12px; font-size: 21px; font-weight: 700; text-align: center; }
  .feedback.good { color: var(--green-dark); } .feedback.bad { color: var(--red); }
  .feedback .why { display: block; font-weight: 500; color: var(--muted); font-size: 18px; margin-top: 4px; }
  .actions { text-align: center; margin-top: 10px; }
  .btn { background: var(--ink); color: var(--white); border: 0; font: inherit; font-weight: 700; padding: 12px 26px; border-radius: 10px; cursor: pointer; font-size: 20px; }
  .btn.amber { background: var(--amber); color: var(--ink); }
  .hidden { display: none !important; }
  .start, .win { text-align: center; padding: 20px 10px; }
  .start input { font-family: inherit; font-size: 32px; font-weight: 700; padding: 14px 22px; border: 3px solid var(--line); border-radius: 14px; width: 440px; max-width: 100%; text-align: center; }
  .start input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
  .classes { display: flex; gap: 12px; justify-content: center; margin: 14px 0; }
  .classes button { font: inherit; font-size: 26px; font-weight: 800; padding: 12px 26px; border-radius: 12px; border: 3px solid var(--line); background: var(--white); cursor: pointer; }
  .classes button.on { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .rules { display: inline-block; text-align: left; background: var(--card); border-radius: 14px; padding: 12px 24px; margin: 8px 0 12px; }
  .win h2 { font-size: 44px; margin: 4px 0; color: var(--green-dark); }
  .win .big { font: 800 60px "Courier New", monospace; margin: 4px 0; }
  .win table { margin: 10px auto; border-collapse: collapse; font-size: 18px; }
  .win td { padding: 5px 14px; border-bottom: 1px solid var(--line); text-align: left; }
  .win td.n { text-align: right; font-weight: 800; font-family: "Courier New", monospace; }
  footer { color: var(--muted); font-size: 14px; text-align: center; margin-top: 24px; }
  footer a { color: var(--muted); }
  @media (max-width: 820px) { .lab { grid-template-columns: 1fr; } .school img { height: 40px; } }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .filters { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .filters button { font: 800 18px Arial, sans-serif; padding: 8px 16px; border-radius: 10px; border: 2px solid #334155; background: transparent; color: #CBD5E1; cursor: pointer; }
  .filters button.on { background: var(--amber); border-color: var(--amber); color: var(--ink); }
  .clock { color: #94A3B8; font-size: 14px; text-align: right; margin-left: 14px; min-width: 150px; }
  .clock b { display: block; font: 800 26px "Courier New", monospace; color: var(--amber); }
  .boards { flex: 1; min-height: 0; display: flex; gap: 18px; padding: 18px 24px; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card); border-radius: 16px; overflow: hidden; }
  .col h2 { margin: 0; padding: 14px 18px 10px; font-size: 28px; background: var(--ink); color: var(--white); display: flex; align-items: baseline; gap: 10px; }
  .col h2 .n { margin-left: auto; font-size: 16px; color: #94A3B8; font-weight: 600; }
  .col .sub { background: var(--ink); color: var(--amber); font-weight: 700; font-size: 15px; padding: 0 18px 12px; }
  .list { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  .list table { width: 100%; border-collapse: collapse; font-size: 24px; }
  .list td { padding: 8px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .list td.r { width: 56px; text-align: center; font-weight: 800; color: var(--muted); }
  .list td.nm { overflow: hidden; text-overflow: ellipsis; max-width: 1px; width: 100%; font-weight: 700; }
  .list td.nm span { color: var(--muted); font-weight: 600; font-size: 18px; margin-left: 6px; }
  .list td.sc { text-align: right; font: 800 26px "Courier New", monospace; }
  .list tr.top1 td { background: #FEF3C7; } .list tr.top2 td { background: #F1F5F9; } .list tr.top3 td { background: #FFEDD5; }
  .list tr.top1 td.r, .list tr.top2 td.r, .list tr.top3 td.r { font-size: 28px; }
  .list tr.fresh td { animation: fresh 6s ease-out; }
  @keyframes fresh { 0%, 40% { background: #BBF7D0; } 100% { } }
  .empty { padding: 30px 18px; color: var(--muted); font-size: 22px; text-align: center; }
  .foot { text-align: center; color: var(--muted); font-size: 14px; padding: 0 0 10px; }
</style>
</head>
<body>
<div class="school">
  <img class="acs" src="../assets/acs-header.png" alt="Assumption College Sriracha">
  <img src="../assets/mlp-logo.png" alt="Modern Language Program">
</div>
<header>
  <div><div class="kicker">ICT 7 · Logic Gates</div><h1>🏆 Top Scores</h1><div class="credit">Designed by <b>Mr. Angelo de Villa</b></div></div>
  <div class="filters" id="filters"><button class="on">All</button><button>7A</button><button>7B</button><button>7C</button></div>
  <div class="clock"><b id="clock"></b><span id="updated">Loading…</span></div>
</header>
<div class="boards" id="boards"></div>
<div class="foot">Updates every 20 seconds · new scores flash green · long lists scroll by themselves</div>
<script>
(function () {
  "use strict";
  var SCORE_URL = "https://script.google.com/macros/s/AKfycbwGfGhDRjyTZJ2Y2Rjv7kMhflGVrs6RNkuuBfHDxO11dbH-tpLHXlbH0Rnx060KyFDJ/exec";
  var BOARDS = [
    { id: "ict7-showdown", icon: "⚡", name: "Logic Showdown", sub: "logic-escape/showdown" },
    { id: "ict7-bomb", icon: "💣", name: "Bomb Squad", sub: "logic-escape/bombsquad" },
    { id: "ict7-control", icon: "🎛️", name: "Control Room", sub: "logic-escape/controlroom" }
  ];
  var REFRESH = 20000;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var params = new URLSearchParams(location.search);
  var cls = ["7A", "7B", "7C"].indexOf(params.get("class")) >= 0 ? params.get("class") : "All";
  var only = params.get("board");   // e.g. ?board=ict7-bomb shows just that board
  var shown = BOARDS.filter(function (b) { return !only || b.id === only || b.id === "ict7-" + only; });
  if (!shown.length) shown = BOARDS;
  var data = {}, prev = {}, first = true;

  $("boards").innerHTML = shown.map(function (b) {
    return '<div class="col"><h2>' + b.icon + " " + b.name + '<span class="n" id="n-' + b.id + '"></span></h2><div class="sub">' + b.sub +
      '</div><div class="list" id="l-' + b.id + '"><div class="empty">Loading…</div></div></div>';
  }).join("");

  function draw() {
    shown.forEach(function (b) {
      var list = (data[b.id] || []).filter(function (e) { return cls === "All" || e.cls === cls; });
      $("n-" + b.id).textContent = data[b.id] ? list.length + (list.length === 1 ? " player" : " players") : "";
      var box = $("l-" + b.id), keep = box.scrollTop;
      if (!data[b.id]) { box.innerHTML = '<div class="empty">' + (b.err || "Loading…") + "</div>"; return; }
      if (!list.length) { box.innerHTML = '<div class="empty">No scores yet' + (cls === "All" ? "" : " for " + cls) + ". Be the first!</div>"; return; }
      var rank = 0, last = null;
      box.innerHTML = "<table>" + list.map(function (e, i) {
        if (e.score !== last) { rank = i + 1; last = e.score; }   // ties share a place
        var key = b.id + "|" + e.name.toLowerCase() + "|" + e.cls, fresh = !first && prev[key] !== e.score;
        var r = ["🥇", "🥈", "🥉"][rank - 1] || rank;
        return '<tr class="' + (rank <= 3 ? "top" + rank : "") + (fresh ? " fresh" : "") + '"><td class="r">' + r + '</td><td class="nm">' + esc(e.name) + "<span>" + (e.cls === "T" ? "Teacher" : esc(e.cls)) +
          '</span></td><td class="sc">' + e.score + "</td></tr>";
      }).join("") + "</table>";
      box.scrollTop = keep;
    });
  }
  function load() {
    var jobs = shown.map(function (b) {
      return fetch(SCORE_URL + "?board=" + b.id + "&t=" + Date.now()).then(function (r) { return r.json(); })
        .then(function (d) { if (!d.ok) throw d.error || 0; b.err = null; return [b, d.top]; })
        .catch(function () { b.err = "Scores not available right now. Retrying…"; return [b, null]; });
    });
    Promise.all(jobs).then(function (res) {
      var p = {};
      shown.forEach(function (b) { (data[b.id] || []).forEach(function (e) { p[b.id + "|" + e.name.toLowerCase() + "|" + e.cls] = e.score; }); });
      prev = p;
      res.forEach(function (x) { if (x[1]) data[x[0].id] = x[1]; });
      draw(); first = false;
      var t = new Date();
      $("updated").textContent = "Updated " + t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    });
  }

  // slow auto-scroll for lists taller than the screen: pause at the top, glide down, pause, jump back up
  var scrollState = {};
  setInterval(function () {
    shown.forEach(function (b) {
      var box = $("l-" + b.id), st = scrollState[b.id] || (scrollState[b.id] = { wait: 80 });
      if (box.scrollHeight <= box.clientHeight + 2) { box.scrollTop = 0; return; }
      if (st.wait > 0) { st.wait--; return; }
      if (st.reset) { box.scrollTop = 0; st.reset = false; st.wait = 80; return; }
      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 1) { st.wait = 80; st.reset = true; return; }
      box.scrollTop += 1;
    });
  }, 40);

  $("filters").querySelectorAll("button").forEach(function (btn) {
    btn.classList.toggle("on", btn.textContent === cls);
    btn.onclick = function () {
      cls = btn.textContent;
      $("filters").querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === btn); });
      var u = new URL(location.href); if (cls === "All") u.searchParams.delete("class"); else u.searchParams.set("class", cls); history.replaceState(null, "", u);
      shown.forEach(function (b) { $("l-" + b.id).scrollTop = 0; scrollState[b.id] = { wait: 80 }; });
      draw();
    };
  });
  function tick() { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  tick(); setInterval(tick, 10000);
  load(); setInterval(load, REFRESH);
  window.__SC = { data: data, draw: draw };
})();
</script>
</body>
</html>
