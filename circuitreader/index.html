<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Reader</title>
<style>
  :root {
    --navy: #0B1D2E; --ink: #0F172A; --card: #EEF2F7; --line: #CBD5E1; --muted: #64748B;
    --amber: #F59E0B; --amber-soft: #FEF3C7; --green: #22C55E; --green-dark: #15803D; --green-soft: #DCFCE7;
    --red: #DC2626; --red-soft: #FEE2E2; --white: #FFFFFF; --violet: #7C3AED;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--white); color: var(--ink); font: 18px/1.4 -apple-system, "Segoe UI", Calibri, Arial, sans-serif; }
  .school { background: var(--white); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .school img { height: 64px; width: auto; display: block; }
  .school .acs { max-width: 70%; object-fit: contain; }
  header { background: var(--navy); color: var(--white); padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 28px; }
  header .kicker { color: var(--amber); font-weight: 700; font-size: 15px; }
  header .credit { color: #94A3B8; font-size: 14px; margin-top: 2px; }
  header .credit b { color: #CBD5E1; font-weight: 600; }
  header .score { margin-left: auto; text-align: right; }
  header .score b { font: 800 30px "Courier New", monospace; color: var(--amber); display: block; }
  header .score span { color: #94A3B8; font-size: 14px; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 32px; }
  .dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .dots span { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 17px; border: 2px solid var(--line); background: var(--card); color: #94A3B8; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .dots span.done { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); }
  .dots span.here { background: var(--ink); border-color: var(--ink); color: var(--white); }
  .panel { background: var(--amber-soft); border-radius: 14px; padding: 14px 20px; }
  .panel h2 { margin: 0 0 4px; font-size: 25px; }
  .panel .how { color: #92400E; font-weight: 600; }
  .lab { display: grid; grid-template-columns: 1fr 260px; gap: 18px; margin-top: 14px; align-items: start; }
  .bench { background: var(--card); border-radius: 14px; padding: 12px; text-align: center; }
  .bench svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
  .switches { display: flex; gap: 14px; justify-content: center; margin-top: 8px; }
  .sw { font: inherit; font-size: 22px; font-weight: 800; padding: 10px 22px; border-radius: 14px; border: 3px solid var(--line); background: var(--white); cursor: pointer; min-width: 140px; }
  .sw.on { background: var(--green); border-color: var(--green-dark); color: var(--white); }
  .side h3 { margin: 0 0 6px; font-size: 17px; text-align: center; }
  table.tt { border-collapse: collapse; margin: 0 auto; font: 700 22px "Courier New", monospace; }
  table.tt th, table.tt td { border: 2px solid var(--line); padding: 5px 18px; text-align: center; }
  table.tt th { background: var(--ink); color: var(--white); }
  table.tt th.out { background: var(--amber); color: var(--ink); }
  table.tt td.out { background: var(--amber-soft); min-width: 70px; }
  table.tt tr.now td { outline: 3px solid var(--amber); outline-offset: -3px; }
  .tested { text-align: center; color: var(--muted); font-weight: 700; margin-top: 8px; }
  .choices { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .choices button { min-width: 120px; font: inherit; font-size: 23px; font-weight: 800; padding: 12px 20px; border-radius: 14px; border: 3px solid var(--line); background: var(--white); color: var(--ink); cursor: pointer; }
  .choices button:hover:not([disabled]) { border-color: var(--amber); background: var(--amber-soft); }
  .choices button.right { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); }
  .choices button.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .choices button[disabled] { cursor: default; opacity: .9; }
  .q { text-align: center; font-size: 22px; font-weight: 800; margin-top: 14px; }
  .feedback { min-height: 56px; margin-top: 12px; font-size: 21px; font-weight: 700; text-align: center; }
  .feedback.good { color: var(--green-dark); } .feedback.bad { color: var(--red); }
  .feedback .why { display: block; font-weight: 500; color: var(--muted); font-size: 18px; margin-top: 4px; }
  .actions { text-align: center; margin-top: 10px; }
  .btn { background: var(--ink); color: var(--white); border: 0; font: inherit; font-weight: 700; padding: 12px 26px; border-radius: 10px; cursor: pointer; font-size: 20px; }
  .btn.amber { background: var(--amber); color: var(--ink); }
  .hidden { display: none !important; }
  .start, .win { text-align: center; padding: 20px 10px; }
  .start input { font-family: inherit; font-size: 32px; font-weight: 700; padding: 14px 22px; border: 3px solid var(--line); border-radius: 14px; width: 440px; max-width: 100%; text-align: center; }
  .start input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
  .classes { display: flex; gap: 12px; justify-content: center; margin: 14px 0; }
  .classes button { font: inherit; font-size: 26px; font-weight: 800; padding: 12px 26px; border-radius: 12px; border: 3px solid var(--line); background: var(--white); cursor: pointer; }
  .classes button.on { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .rules { display: inline-block; text-align: left; background: var(--card); border-radius: 14px; padding: 12px 24px; margin: 8px 0 12px; }
  .win h2 { font-size: 44px; margin: 4px 0; color: var(--green-dark); }
  .win .big { font: 800 60px "Courier New", monospace; margin: 4px 0; }
  .win table { margin: 10px auto; border-collapse: collapse; font-size: 18px; }
  .win td { padding: 5px 14px; border-bottom: 1px solid var(--line); text-align: left; }
  .win td.n { text-align: right; font-weight: 800; font-family: "Courier New", monospace; }
  footer { color: var(--muted); font-size: 14px; text-align: center; margin-top: 24px; }
  footer a { color: var(--muted); }
  @media (max-width: 820px) { .lab { grid-template-columns: 1fr; } .school img { height: 40px; } }
  .tabs { display: flex; gap: 10px; justify-content: center; margin: 4px 0 14px; }
  .tabs button { font: 800 18px Arial, sans-serif; padding: 10px 22px; border-radius: 12px; border: 3px solid var(--line); background: var(--white); cursor: pointer; }
  .tabs button.on { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .card { background: var(--card); border-radius: 16px; padding: 16px 20px; }
  .card h2 { margin: 0 0 6px; }
  .card p { margin: 6px 0; font-size: 19px; }
  .row2 { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
  .row2 > div { flex: 1 1 340px; }
  .diagram svg { width: 100%; max-width: 620px; display: block; margin: 0 auto; }
  .expr { font: 800 22px "Courier New", monospace; color: var(--violet); text-align: center; margin: 8px 0; }
  table.tt td.pick { cursor: pointer; background: var(--amber-soft); font-weight: 800; min-width: 44px; }
  table.tt td.pick:hover { outline: 3px solid var(--amber); }
  table.tt td.ok { background: var(--green-soft); }
  table.tt td.bad { background: var(--red-soft); }
  table.tt tr.diff td { background: #EDE9FE; }
  .stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .stats span { background: var(--card); border-radius: 10px; padding: 6px 12px; font-weight: 800; }
  .stats span.m { background: var(--green-soft); color: var(--green-dark); }
</style>
</head>
<body>
<div class="school">
  <img class="acs" src="../assets/acs-header.png" alt="Assumption College Sriracha">
  <img src="../assets/mlp-logo.png" alt="Modern Language Program">
</div>
<header>
  <div><div class="kicker">ICT 8 · Logic Gates</div><h1>Circuit Reader</h1><div class="credit">Designed by <b>Mr. Angelo de Villa</b></div></div>
  <div class="score"><b id="scoreBox"></b><span id="bestBox"></span></div>
</header>
<main>
  <div class="tabs"><button id="tabLearn" class="on">Part 1 · Learn</button><button id="tabPractice">Part 2 · Practice</button></div>

  <section id="learnView">
    <div class="dots" id="learnDots"></div>
    <div class="card" id="learnBox"></div>
    <div class="actions"><button id="backBtn" class="btn" style="background:#fff;color:var(--ink);border:2px solid var(--line)">← Back</button><button id="nextBtn" class="btn amber">Next →</button></div>
  </section>

  <section id="practiceView" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="panel"><h2 id="pTitle"></h2><div class="how" id="pHow"></div></div>
    <div class="diagram" id="pDiagram"></div>
    <div id="pStep"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button id="checkBtn" class="btn hidden">✅ Check my table</button><button id="newBtn" class="btn amber hidden">Next circuit →</button></div>
  </section>
  <footer>Your practice progress is saved on this computer. <a href="#" id="resetLink">Reset my progress</a></footer>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var rnd = Math.random;
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function gate(g, a, b) {
    var r = g === "AND" || g === "NAND" ? a & b : g === "OR" || g === "NOR" ? a | b : a ^ b;
    return g === "NAND" || g === "NOR" || g === "XNOR" ? 1 - r : r;
  }
  var ROWS = []; for (var i = 0; i < 8; i++) ROWS.push([i >> 2 & 1, i >> 1 & 1, i & 1]);
  // a circuit is {g1, g2, inner}: inner "AB" = (A g1 B) g2 C ; inner "BC" = A g2 (B g1 C)
  function out(c, a, b, cc) { return c.inner === "AB" ? gate(c.g2, gate(c.g1, a, b), cc) : gate(c.g2, a, gate(c.g1, b, cc)); }
  function mid(c, a, b, cc) { return c.inner === "AB" ? gate(c.g1, a, b) : gate(c.g1, b, cc); }
  function expr(c) { return c.inner === "AB" ? "(A " + c.g1 + " B) " + c.g2 + " C" : "A " + c.g2 + " (B " + c.g1 + " C)"; }
  function col(c) { return ROWS.map(function (r) { return out(c, r[0], r[1], r[2]); }).join(""); }

  // ---------- drawing ----------
  var NAV = "#0F172A", ON = "#22C55E", OFF = "#94A3B8";
  function gateBody(g, x, y, h, w, label) {
    var isAnd = g === "AND" || g === "NAND", bub = /^N|XNOR/.test(g), s = "";
    if (g === "XOR" || g === "XNOR") s += '<path d="M' + (x - 10) + " " + y + " Q" + (x + 14) + " " + (y + h / 2) + " " + (x - 10) + " " + (y + h) + '" fill="none" stroke="' + NAV + '" stroke-width="4"/>';
    s += isAnd ? '<path d="M' + x + " " + y + " H" + (x + w - h / 2) + " A" + h / 2 + " " + h / 2 + " 0 0 1 " + (x + w - h / 2) + " " + (y + h) + " H" + x + ' Z" fill="#fff" stroke="' + NAV + '" stroke-width="4"/>'
      : '<path d="M' + (x - 4) + " " + y + " Q" + (x + 22) + " " + (y + h / 2) + " " + (x - 4) + " " + (y + h) + " Q" + (x + w * .65) + " " + (y + h) + " " + (x + w) + " " + (y + h / 2) + " Q" + (x + w * .65) + " " + y + " " + (x - 4) + " " + y + ' Z" fill="#fff" stroke="' + NAV + '" stroke-width="4"/>';
    if (bub) s += '<circle cx="' + (x + w + 7) + '" cy="' + (y + h / 2) + '" r="6" fill="#fff" stroke="' + NAV + '" stroke-width="4"/>';
    if (label) s += '<text x="' + (x + w * .42) + '" y="' + (y + h / 2 + 6) + '" text-anchor="middle" font-size="14" font-weight="800" fill="#B45309" font-family="Arial">' + g + "</text>";
    return s;
  }
  // v = [a,b,c] to colour the wires, or null for a plain drawing
  function diagram(c, v, labels) {
    var col = function (x) { return !v ? NAV : x ? ON : OFF; };
    var a = v ? v[0] : 0, b = v ? v[1] : 0, cc = v ? v[2] : 0, m = v ? mid(c, a, b, cc) : 0, o = v ? out(c, a, b, cc) : 0;
    var yA = 50, yB = 110, yC = 170, s = '<svg viewBox="0 0 620 220" role="img" aria-label="' + expr(c) + '">';
    var first = c.inner === "AB" ? [yA, yB] : [yB, yC], alone = c.inner === "AB" ? yC : yA, aloneV = c.inner === "AB" ? cc : a;
    var gy = (first[0] + first[1]) / 2 - 30, g2y = c.inner === "AB" ? 115 : 55;
    [["A", yA, a], ["B", yB, b], ["C", yC, cc]].forEach(function (w) {
      s += '<circle cx="30" cy="' + w[1] + '" r="18" fill="' + (v ? col(w[2]) : "#334155") + '"/><text x="30" y="' + (w[1] + 6) + '" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" font-family="Arial">' + w[0] + "</text>";
    });
    // inputs into gate 1
    first.forEach(function (y, k) { var val = c.inner === "AB" ? [a, b][k] : [b, cc][k]; s += '<polyline points="48,' + y + " 150," + y + " 150," + (gy + 15 + k * 30) + " 190," + (gy + 15 + k * 30) + '" fill="none" stroke="' + col(val) + '" stroke-width="5"/>'; });
    s += gateBody(c.g1, 190, gy, 60, 76, labels);
    var x1 = 266 + (/^N|XNOR/.test(c.g1) ? 14 : 0), my = gy + 30;
    // middle wire X and the lone input into gate 2
    var inTop = c.inner === "AB" ? g2y + 15 : g2y + 45, loneIn = c.inner === "AB" ? g2y + 45 : g2y + 15;
    s += '<polyline points="' + x1 + "," + my + " 340," + my + " 340," + inTop + " 380," + inTop + '" fill="none" stroke="' + col(m) + '" stroke-width="5"/>';
    s += '<text x="318" y="' + (my - 8) + '" text-anchor="middle" font-size="16" font-weight="800" fill="#7C3AED" font-family="Arial">X' + (v ? " = " + m : "") + "</text>";
    s += '<polyline points="48,' + alone + " 360," + alone + " 360," + loneIn + " 380," + loneIn + '" fill="none" stroke="' + col(aloneV) + '" stroke-width="5"/>';
    s += gateBody(c.g2, 380, g2y, 60, 76, labels);
    var x2 = 456 + (/^N|XNOR/.test(c.g2) ? 14 : 0);
    s += '<line x1="' + x2 + '" y1="' + (g2y + 30) + '" x2="540" y2="' + (g2y + 30) + '" stroke="' + col(o) + '" stroke-width="5"/>';
    s += '<circle cx="566" cy="' + (g2y + 30) + '" r="22" fill="' + (v && o ? "#FACC15" : "#E2E8F0") + '" stroke="' + (v && o ? "#CA8A04" : "#94A3B8") + '" stroke-width="4"/>';
    s += '<text x="566" y="' + (g2y + 72) + '" text-anchor="middle" font-size="15" font-weight="800" fill="' + NAV + '" font-family="Arial">' + (v ? "Out = " + o : "Out") + "</text>";
    return s + "</svg>";
  }
  function switches(v, onFlip) {
    var d = document.createElement("div"); d.className = "switches";
    ["A", "B", "C"].forEach(function (n, k) {
      var b = document.createElement("button"); b.className = "sw" + (v[k] ? " on" : ""); b.textContent = n + " = " + v[k];
      b.onclick = function () { v[k] = 1 - v[k]; onFlip(); }; d.appendChild(b);
    });
    return d;
  }
  // truth table: fixed columns + clickable answer columns; ans[key][row] = null/0/1
  function table(headers, fixed, pickCols, ans, marks) {
    var h = '<table class="tt"><tr>' + headers.map(function (x, k) { return "<th" + (k >= headers.length - pickCols.length ? ' class="out"' : "") + ">" + x + "</th>"; }).join("") + "</tr>";
    ROWS.forEach(function (r, i) {
      h += "<tr>" + fixed(r).map(function (x) { return "<td>" + x + "</td>"; }).join("") + pickCols.map(function (k) {
        var val = ans[k][i], m = marks ? (marks[k][i] ? " ok" : " bad") : "";
        return '<td class="pick' + m + '" data-k="' + k + '" data-i="' + i + '">' + (val === null ? "?" : val) + "</td>"; }).join("") + "</tr>";
    });
    return h + "</table>";
  }
  function wireTable(box, ans, redraw) {
    box.querySelectorAll("td.pick").forEach(function (td) { td.onclick = function () {
      var k = td.getAttribute("data-k"), i = +td.getAttribute("data-i"), v = ans[k][i];
      ans[k][i] = v === null ? 0 : v === 0 ? 1 : 0; redraw(); }; });
  }
  function fb(ok, t, why) { $("feedback").className = "feedback " + (ok === null ? "" : ok ? "good" : "bad"); $("feedback").innerHTML = t + (why ? '<span class="why">' + why + "</span>" : ""); }

  // ---------- Part 1: Learn ----------
  var EX = { g1: "AND", g2: "OR", inner: "AB" }, EX2 = { g1: "OR", g2: "AND", inner: "AB" };
  var STEPS = [
    function (box) {
      var v = [1, 1, 0];
      box.innerHTML = "<h2>1 · Read a circuit from left to right</h2><p>Signals flow from the <b>inputs</b> on the left, through <b>gate 1</b>, then <b>gate 2</b>, to the <b>output</b> lamp. Flip the switches and follow the green wires.</p><div class='diagram' id='d1'></div>";
      function draw() { $("d1").innerHTML = diagram(EX, v, true); var sw = box.querySelector(".switches"); if (sw) sw.remove(); box.appendChild(switches(v, draw)); }
      draw();
    },
    function (box) {
      var shown = 0;
      box.innerHTML = "<h2>2 · Give the middle wire a name</h2><p>The wire between the two gates is the answer of gate 1. Call it <b>X</b>. Then write gate 2 using X.</p><div class='diagram'>" + diagram(EX, null, true) + "</div><div id='ex2'></div><div class='actions'><button class='btn' id='revBtn'>Show the next line</button></div>";
      var lines = ["X = A AND B", "Out = X OR C", "Out = (A AND B) OR C   ← put X back in, with brackets"];
      $("revBtn").onclick = function () { shown = Math.min(3, shown + 1); $("ex2").innerHTML = lines.slice(0, shown).map(function (l) { return "<div class='expr'>" + l + "</div>"; }).join(""); };
    },
    function (box) {
      var c1 = EX, c2 = { g1: "OR", g2: "AND", inner: "BC" };
      box.innerHTML = "<h2>3 · Brackets change the answer</h2><p>Same gates, different order. The brackets show which gate happens <b>first</b>. Purple rows are where the two circuits disagree.</p>" +
        "<div class='row2'><div><div class='expr'>" + expr(c1) + "</div><div class='diagram'>" + diagram(c1, null, true) + "</div></div><div><div class='expr'>" + expr({ g1: "OR", g2: "AND", inner: "BC" }) + "</div><div class='diagram'>" + diagram(c2, null, true) + "</div></div></div>" +
        '<table class="tt" style="margin:10px auto"><tr><th>A</th><th>B</th><th>C</th><th class="out">(A AND B) OR C</th><th class="out">A AND (B OR C)</th></tr>' +
        ROWS.map(function (r) { var x = out(c1, r[0], r[1], r[2]), y = out(c2, r[0], r[1], r[2]); return "<tr class='" + (x !== y ? "diff" : "") + "'><td>" + r.join("</td><td>") + "</td><td>" + x + "</td><td>" + y + "</td></tr>"; }).join("") + "</table>";
    },
    function (box) {
      var ans = { X: ROWS.map(function () { return null; }), O: ROWS.map(function () { return null; }) }, marks = null;
      box.innerHTML = "<h2>4 · Fill the truth table: X first, then Out</h2><p>Circuit: <b>(A OR B) AND C</b>. Work out the <b>X = A OR B</b> column first, then <b>Out = X AND C</b>. Click a ? to change it.</p>" +
        "<div class='row2'><div class='diagram'>" + diagram(EX2, null, true) + "</div><div id='t4'></div></div><div class='actions'><button class='btn' id='chk4'>✅ Check</button></div><div class='feedback' id='fb4'></div>";
      function draw() { $("t4").innerHTML = table(["A", "B", "C", "X", "Out"], function (r) { return r; }, ["X", "O"], ans, marks); wireTable($("t4"), ans, function () { marks = null; draw(); }); }
      draw();
      $("chk4").onclick = function () {
        marks = { X: ROWS.map(function (r, i) { return ans.X[i] === mid(EX2, r[0], r[1], r[2]); }), O: ROWS.map(function (r, i) { return ans.O[i] === out(EX2, r[0], r[1], r[2]); }) };
        var right = marks.X.concat(marks.O).filter(Boolean).length; draw();
        $("fb4").className = "feedback " + (right === 16 ? "good" : "bad");
        $("fb4").innerHTML = right === 16 ? "✔ Perfect! X makes Out easy." : "✘ " + right + " of 16 right. Red cells are wrong. Tip: Out can only be 1 when C = 1.";
      };
    },
    function (box) {
      var G = ["AND", "OR", "XOR", "NAND", "NOR", "XNOR"];
      box.innerHTML = "<h2>5 · Your gate cheat sheet</h2><p>Part 2 uses all six gates. A bubble means NOT: it flips the answer. XNOR is 1 when the inputs are the <b>same</b>.</p>" +
        '<table class="tt" style="margin:10px auto"><tr><th>A</th><th>B</th>' + G.map(function (g) { return '<th class="out">' + g + "</th>"; }).join("") + "</tr>" +
        [[0, 0], [0, 1], [1, 0], [1, 1]].map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td>" + G.map(function (g) { return "<td>" + gate(g, r[0], r[1]) + "</td>"; }).join("") + "</tr>"; }).join("") + "</table>" +
        "<p style='text-align:center'><b>Ready?</b> Part 2 gives you random circuits. Read them, write them, and master them.</p>";
    }
  ];
  var step = 0;
  function showStep() {
    $("learnDots").innerHTML = STEPS.map(function (s, i) { return '<span class="' + (i < step ? "done" : i === step ? "here" : "") + '">' + (i + 1) + "</span>"; }).join("");
    STEPS[step]($("learnBox"));
    $("backBtn").disabled = step === 0;
    $("nextBtn").textContent = step === STEPS.length - 1 ? "Start Part 2 →" : "Next →";
  }
  $("backBtn").onclick = function () { if (step > 0) { step--; showStep(); } };
  $("nextBtn").onclick = function () { if (step < STEPS.length - 1) { step++; showStep(); } else tab("practice"); };

  // ---------- Part 2: Practice (random, repeatable) ----------
  var KEY = "circuitReader.v1", P = { level: 1, streak: 0, best: 0, points: 0, rounds: 0, mastered: false };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) P = saved; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
  var POOL = { 1: ["AND", "OR"], 2: ["AND", "OR", "XOR"], 3: ["AND", "OR", "XOR", "NAND", "NOR", "XNOR"] };
  var NEED = 3, MASTER = 5;   // perfect rounds in a row to level up / to master level 3
  function newCircuit() {
    for (;;) {
      var c = { g1: pick(POOL[P.level]), g2: pick(POOL[P.level]), inner: P.level === 1 ? "AB" : pick(["AB", "BC"]) };
      if (!/^(0+|1+)$/.test(col(c))) return c;
    }
  }
  function decoys(c) {   // wrong expressions that look alike: other bracket order, or one gate swapped
    var cands = [{ g1: c.g1, g2: c.g2, inner: c.inner === "AB" ? "BC" : "AB" }];
    POOL[Math.max(2, P.level)].forEach(function (g) { if (g !== c.g1) cands.push({ g1: g, g2: c.g2, inner: c.inner }); if (g !== c.g2) cands.push({ g1: c.g1, g2: g, inner: c.inner }); });
    var seen = {}, outL = []; seen[expr(c)] = 1;
    [cands[0]].concat(shuffle(cands.slice(1))).forEach(function (d) { if (outL.length < 2 && !seen[expr(d)]) { seen[expr(d)] = 1; outL.push(d); } });
    return outL;
  }
  function stats() {
    $("stats").innerHTML = "<span>Level " + P.level + " of 3</span><span>Streak " + P.streak + "</span><span>Best streak " + P.best + "</span><span>Rounds " + P.rounds + "</span>" + (P.mastered ? "<span class='m'>🏅 MASTERED</span>" : "");
    $("scoreBox").textContent = P.points + " pts"; $("bestBox").textContent = P.mastered ? "🏅 Mastered" : "Level " + P.level;
  }
  var R = null;
  function round() {
    var c = newCircuit(), opts = shuffle([c].concat(decoys(c)));
    R = { c: c, opts: opts, exprOk: null, ans: { O: ROWS.map(function () { return null; }) }, marks: null, done: false };
    $("pTitle").textContent = "Circuit " + (P.rounds + 1);
    $("pHow").innerHTML = "<b>Step 1:</b> which expression matches the circuit? " + (P.level === 3 ? "(Level 3: no gate names, read the shapes!)" : "");
    $("pDiagram").innerHTML = diagram(c, null, P.level < 3);
    $("pStep").innerHTML = '<div class="choices">' + opts.map(function (o, i) { return '<button data-i="' + i + '" style="font-family:Courier New,monospace;font-weight:800">' + expr(o) + "</button>"; }).join("") + "</div>";
    $("feedback").className = "feedback"; $("feedback").innerHTML = ""; $("checkBtn").classList.add("hidden"); $("newBtn").classList.add("hidden");
    $("pStep").querySelectorAll("button").forEach(function (b) { b.onclick = function () {
      var i = +b.getAttribute("data-i"); R.exprOk = opts[i] === c;
      $("pStep").querySelectorAll("button").forEach(function (x) { x.disabled = true; if (opts[+x.getAttribute("data-i")] === c) x.classList.add("right"); });
      if (!R.exprOk) b.classList.add("wrong");
      fb(R.exprOk, R.exprOk ? "✔ Right expression! +1" : "✘ It was " + expr(c) + ".", "Step 2: fill in the Out column for all 8 rows, then press Check.");
      if (R.exprOk) P.points++;
      tableStep();
    }; });
    stats();
  }
  function tableStep() {
    var box = document.createElement("div"); box.id = "pTable"; box.style.marginTop = "12px";
    $("pStep").appendChild(box);
    function draw() { box.innerHTML = '<div class="expr">' + expr(R.c) + "</div>" + table(["A", "B", "C", "Out"], function (r) { return r; }, ["O"], R.ans, R.marks); if (!R.done) wireTable(box, R.ans, draw); }
    draw(); $("checkBtn").classList.remove("hidden");
    $("checkBtn").onclick = function () {
      if (R.ans.O.some(function (v) { return v === null; })) { fb(false, "Fill every row first!", "Click each ? until it shows 0 or 1."); return; }
      R.marks = { O: ROWS.map(function (r, i) { return R.ans.O[i] === out(R.c, r[0], r[1], r[2]); }) };
      var right = R.marks.O.filter(Boolean).length, perfect = right === 8 && R.exprOk;
      R.done = true; draw(); $("checkBtn").classList.add("hidden");
      if (right === 8) P.points += 2;
      P.rounds++; P.streak = perfect ? P.streak + 1 : 0; P.best = Math.max(P.best, P.streak);
      var msg = perfect ? "✔ Perfect circuit! +2" : right === 8 ? "✔ Table right (+2), but the expression was wrong, so the streak resets." : "✘ " + right + " of 8 rows right. Red rows are wrong.";
      var why = right === 8 ? "" : "Tip: write the X column on paper first (X = the gate inside the brackets), then use X for Out.";
      if (perfect && P.level < 3 && P.streak >= NEED) { P.level++; P.streak = 0; why = "🎉 LEVEL UP! Level " + P.level + (P.level === 2 ? " adds XOR and both bracket orders." : " adds NAND, NOR, XNOR and hides the gate names."); }
      else if (perfect && P.level === 3 && P.streak >= MASTER && !P.mastered) { P.mastered = true; why = "🏅 MASTERED! You read " + MASTER + " level-3 circuits in a row perfectly. Keep going to raise your best streak."; }
      else if (perfect) why = P.level < 3 ? (NEED - P.streak) + " more perfect in a row to level up." : P.mastered ? "" : (MASTER - P.streak) + " more perfect in a row to master it.";
      fb(right === 8, msg, why); save(); stats();
      $("newBtn").classList.remove("hidden");
    };
  }
  $("newBtn").onclick = round;
  $("resetLink").onclick = function (e) { e.preventDefault(); if (confirm("Reset your level and streak?")) { P = { level: 1, streak: 0, best: 0, points: 0, rounds: 0, mastered: false }; save(); round(); } };

  function tab(t) {
    $("tabLearn").classList.toggle("on", t === "learn"); $("tabPractice").classList.toggle("on", t === "practice");
    $("learnView").classList.toggle("hidden", t !== "learn"); $("practiceView").classList.toggle("hidden", t !== "practice");
    if (t === "practice" && !R) round();
  }
  $("tabLearn").onclick = function () { tab("learn"); };
  $("tabPractice").onclick = function () { tab("practice"); };
  showStep(); stats();
  window.__CRD = { out: out, col: col, expr: expr, decoys: decoys, newCircuit: newCircuit, P: function () { return P; }, R: function () { return R; } };
})();
</script>
